# Tag a version, get binaries.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Every executable is published as a plain file named `<binary>-<target>`, plus
# one `SHA256SUMS` for the whole release. That is exactly what the agent's
# updater expects (crates/mydrives-core/src/update.rs): no archive to unpack,
# one checksum file to verify against.
name: release

on:
  push:
    tags: ["v*"]
  # Lets a failed release be re-run without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The updater compares the release tag with the version compiled into the
  # binary. If they disagree, every client would re-download the same release
  # forever, so the mismatch is caught before anything is built.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag workspace version=$version"
          test "$tag" = "v$version"

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # One runner per OS, not one per target: the Intel slice
          # cross-compiles from Apple Silicon, so a second macOS runner would
          # repeat the checkout, the toolchain and the cache for nothing.
          #
          # `macos-latest` rather than a pinned `macos-14`: the pinned label
          # resolves to an XL runner this account does not have ("The
          # configuration macos-14-arm64-us-xl is not supported").
          - os: macos-latest
            id: macos
            targets: aarch64-apple-darwin x86_64-apple-darwin
            test_target: aarch64-apple-darwin
            # Without `macfuse` the FUSE provider is compiled out and the agent
            # falls back to the NFS layer - a drive that works but never
            # reaches Finder's sidebar. The library is linked weakly, so the
            # binary still runs on a Mac that has no FUSE-T.
            features: tray,mydrives-daemon/macfuse
          # Windows ships as x64 only - it runs under emulation on ARM64
          # Windows, and WinFsp installs winfsp-x64.dll there too.
          - os: windows-latest
            id: windows
            targets: x86_64-pc-windows-msvc
            test_target: x86_64-pc-windows-msvc
            features: tray
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the targets this runner builds
        shell: bash
        run: |
          for target in ${{ matrix.targets }}; do
            rustup target add "$target"
          done

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.id }}

      # `winfsp-sys` generates its bindings with bindgen, which needs libclang.
      # The Windows runners ship LLVM; this only points at it.
      - name: Point bindgen at the runner's LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV

      # The macOS build links against FUSE-T, so the runner needs it - the same
      # package the agent installs for itself, from the same place. It is not a
      # kernel extension, so `installer` is all it takes.
      - name: Install FUSE-T
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/macos-fuse-t/fuse-t/releases/latest \
            | grep -o 'https://[^"]*\.pkg' | head -1)
          echo "package: $url"
          curl -fsSL "$url" -o /tmp/fuse-t.pkg
          sudo installer -pkg /tmp/fuse-t.pkg -target /
          test -f /usr/local/lib/libfuse-t.dylib
          # fuser asks pkg-config for `fuse` (libfuse2); FUSE-T installs itself
          # as `fuse-t`, so this is the same file under the name it looks for.
          sudo mkdir -p /usr/local/lib/pkgconfig
          sudo tee /usr/local/lib/pkgconfig/fuse.pc >/dev/null <<'PC'
          prefix=/usr/local
          libdir=${prefix}/lib
          includedir=${prefix}/include/fuse
          Name: fuse
          Version: 2.9.9
          Libs: -L${libdir} -lfuse-t
          Cflags: -I${includedir}
          PC
          # Homebrew's pkg-config on Apple Silicon searches /opt/homebrew, not
          # /usr/local where FUSE-T installs, so the build steps need pointing
          # at it. GITHUB_ENV carries it to them.
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig pkg-config --libs fuse

      - name: Build
        shell: bash
        env:
          # The Intel slice cross-compiles from Apple Silicon, and pkg-config
          # refuses to answer across architectures unless told to. FUSE-T's
          # dylib carries both, so the answer is the same either way.
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          for target in ${{ matrix.targets }}; do
            cargo build --release --features ${{ matrix.features }} --target "$target" \
              -p mydrives-daemon -p mydrives-cli -p mydrives-ui
          done

      # Only the runner's own architecture: running the Intel test binaries on
      # an Apple Silicon runner would lean on Rosetta and prove nothing the
      # native run does not.
      - name: Test
        shell: bash
        run: cargo test --release --features ${{ matrix.features }} --workspace --target ${{ matrix.test_target }}

      - name: Package (macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          for target in ${{ matrix.targets }}; do
            for b in mydrivesd mydrives mydrives-ui; do
              cp "target/$target/release/$b" "dist/$b-$target"
            done
          done
          cd dist
          shasum -a 256 mydrives* > "SHA256SUMS.${{ matrix.id }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($target in "${{ matrix.targets }}".Split(" ")) {
            foreach ($b in "mydrivesd", "mydrives", "mydrives-ui") {
              Copy-Item "target/$target/release/$b.exe" "dist/$b-$target.exe"
            }
          }
          Set-Location dist
          Get-ChildItem -File -Filter "mydrives*" | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii "SHA256SUMS.${{ matrix.id }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the binaries and merge the checksums
        run: |
          mkdir -p dist
          find artifacts -type f -name 'mydrives*' -exec cp {} dist/ \;
          cat artifacts/*/SHA256SUMS.* > dist/SHA256SUMS
          ls -l dist
          cat dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          fi
