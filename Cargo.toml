[workspace]
resolver = "2"
members = [
  "crates/mydrives-core",
  "crates/mydrives-backend-smb",
  "crates/mydrives-ipc",
  "crates/mydrives-mount-fuse",
  "crates/mydrives-mount-nfs",
  "crates/mydrives-mount-windows",
  "crates/mydrives-daemon",
  "crates/mydrives-cli",
  "crates/mydrives-ui",
]
# A path dependency inside the workspace joins it by default, which would make
# `cargo test --workspace` build the vendored fuser on its own - and on Windows
# that fails looking for libfuse. It is a dependency of the FUSE provider on the
# platforms that have one, and nothing else.
exclude = ["vendor/fuser"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT"
authors = ["MyDrives"]
rust-version = "1.85"

[workspace.dependencies]
mydrives-core = { path = "crates/mydrives-core" }
mydrives-backend-smb = { path = "crates/mydrives-backend-smb" }
mydrives-ipc = { path = "crates/mydrives-ipc" }
mydrives-mount-fuse = { path = "crates/mydrives-mount-fuse" }
mydrives-mount-nfs = { path = "crates/mydrives-mount-nfs" }
mydrives-mount-windows = { path = "crates/mydrives-mount-windows" }
mydrives-ui = { path = "crates/mydrives-ui" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "io-util", "net", "fs"] }
toml = "0.8"
semver = "1"
sha2 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "charset"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
lto = "thin"
