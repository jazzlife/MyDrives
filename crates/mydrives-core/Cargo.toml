[package]
name = "mydrives-core"
description = "Backend-agnostic VFS core for the MyDrives network drive agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
semver.workspace = true
sha2.workspace = true
reqwest.workspace = true
tracing.workspace = true

directories = "6"
# PKCE verifiers and the sign-in `state` need real randomness.
getrandom = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
# Finder's sidebar list files are NSKeyedArchiver plists; see `finder.rs`.
plist = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
