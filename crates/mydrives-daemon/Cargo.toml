[package]
name = "mydrives-daemon"
description = "MyDrives background agent (tray / menu bar resident)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mydrivesd"
path = "src/main.rs"

[features]
default = []
# System tray / menu bar UI. Off by default so headless hosts (CI, servers) build
# without a GUI stack; the shipping desktop builds turn it on.
tray = ["dep:tray-icon", "dep:winit"]
# Use macFUSE on macOS instead of the in-box NFS client. Needs macFUSE installed
# at build time.
macfuse = ["mydrives-mount-fuse/macfuse"]

[dependencies]
mydrives-core.workspace = true
mydrives-backend-smb.workspace = true
mydrives-backend-ftp.workspace = true
mydrives-ipc.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true

tray-icon = { version = "0.26", optional = true }
winit = { version = "0.30", optional = true }

[target.'cfg(unix)'.dependencies]
mydrives-mount-fuse.workspace = true
mydrives-mount-nfs.workspace = true

[target.'cfg(windows)'.dependencies]
mydrives-mount-windows.workspace = true

[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "0.13", features = ["build"] }
