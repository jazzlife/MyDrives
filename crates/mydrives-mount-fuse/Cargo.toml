[package]
name = "mydrives-mount-fuse"
description = "FUSE mount provider (Linux, and macOS with macFUSE) for MyDrives"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Build the provider on macOS too. Requires macFUSE and its pkg-config file at
# build time (`fuse.pc`), because fuser's pure-Rust mount path is Linux-only and
# on macOS it links libfuse from macFUSE. Without this feature the crate is empty
# on macOS and the NFS provider - which needs no kernel extension - is used.
macfuse = ["dep:fuser"]

[dependencies]
mydrives-core.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Both targets point at the vendored copy: cargo wants one canonical source for
# a dependency name. Linux keeps the pure-Rust mount path (no libfuse3 package
# needed); macOS links libfuse2, which on this project means FUSE-T.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { path = "../../vendor/fuser", default-features = false }

# macOS: the vendored copy, which can speak FUSE-T's (Linux) struct layout.
# See vendor/fuser/README-MYDRIVES.md.
[target.'cfg(target_os = "macos")'.dependencies]
fuser = { path = "../../vendor/fuser", optional = true, features = ["libfuse2"] }
